<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FitCenter Pro - 체육시설 통합 운영 플랫폼</title>
<style>
:root { --bg:#090d16; --panel:#131d31; --border:#1e293b; --pri:#10b981; --text:#f1f5f9; }
* { margin:0; padding:0; box-sizing:border-box; font-family:-apple-system,BlinkMacSystemFont,sans-serif; }
body { background:var(--bg); color:var(--text); min-height:100vh; display:flex; flex-direction:column; }
header { background:#0f172a; border-bottom:1px solid var(--border); padding:12px 24px; display:flex; justify-content:space-between; align-items:center; }
.brand { display:flex; align-items:center; gap:10px; font-weight:800; font-size:17px; color:#34d399; }
.back-btn { background:#1e293b; color:#94a3b8; padding:6px 12px; border-radius:6px; font-size:12px; text-decoration:none; }
main { padding:20px; flex:1; max-width:1400px; margin:0 auto; width:100%; display:flex; flex-direction:column; gap:20px; }
.tabs { display:flex; gap:8px; border-bottom:1px solid var(--border); padding-bottom:12px; }
.tab-btn { background:#1e293b; border:none; color:#94a3b8; padding:8px 16px; border-radius:6px; cursor:pointer; font-weight:600; }
.tab-btn.active { background:var(--pri); color:#fff; }
.grid-bay { display:grid; grid-template-columns:repeat(6,1fr); gap:12px; }
.bay-card { background:var(--panel); border:1px solid var(--border); border-radius:8px; padding:16px; text-align:center; cursor:pointer; transition:all 0.2s; }
.bay-card.occupied { border-color:#ef4444; background:rgba(239,68,68,0.1); }
.bay-card.available { border-color:#10b981; background:rgba(16,185,129,0.1); }
.bay-num { font-size:18px; font-weight:800; margin-bottom:6px; }
.bay-status { font-size:12px; font-weight:600; }
.btn-action { background:var(--pri); border:none; color:#fff; padding:10px 18px; border-radius:6px; cursor:pointer; font-weight:bold; }
</style>
</head>
<body>
<header>
    <div class="brand">
        <span>⛳ FitCenter Pro 통합 시설 운영 관제</span>
    </div>
    <div>
        <button class="btn-action" onclick="quickCheckIn()">+ 신규 회원 입장/타석 배정</button>
    </div>
</header>
<main>
    <div class="tabs">
        <button class="tab-btn active" onclick="switchFacility('golf', this)">스크린골프장 (12타석)</button>
        <button class="tab-btn" onclick="switchFacility('swim', this)">수영장 (6레인)</button>
        <button class="tab-btn" onclick="switchFacility('gym', this)">피트니스 락커 (30개)</button>
    </div>

    <div style="background:var(--panel);padding:16px;border-radius:8px;display:flex;justify-content:space-between;align-items:center;">
        <div>
            <h3 id="facTitle">스크린골프 타석 실시간 현황도</h3>
            <p style="color:#94a3b8;font-size:12px;margin-top:2px;">타석 카드를 클릭하여 배정 / 시간 연장 / 퇴실 처리가 가능합니다.</p>
        </div>
        <div style="display:flex;gap:16px;font-size:13px;">
            <span>● 이용 가능: <strong style="color:#10b981;" id="cntAvail">7석</strong></span>
            <span>● 이용 중: <strong style="color:#ef4444;" id="cntOcc">5석</strong></span>
        </div>
    </div>

    <div class="grid-bay" id="bayContainer">
        <!-- Rendered by JS -->
    </div>
</main>
<script>
let facility = 'golf';
const data = {
    golf: Array.from({length:12}, (_,i)=>({ id: i+1, name:`타석 ${i+1}`, occ: i%2===0, user: i%2===0 ? `회원 ${100+i}` : '', time: i%2===0 ? `${30+i*2}분 남음` : '비어있음' })),
    swim: Array.from({length:6}, (_,i)=>({ id: i+1, name:`레인 ${i+1} (${i<3?'초급':'상급'})`, occ: i<4, user: i<4 ? '강습 진행 중' : '', time: i<4 ? '25분 남음' : '자유수영 가능' })),
    gym: Array.from({length:18}, (_,i)=>({ id: i+1, name:`락커 #${i+1}`, occ: i%3===0, user: i%3===0 ? `회원 G-${i}` : '', time: i%3===0 ? '사용 중' : '사용 가능' }))
};

function renderBays() {
    const list = data[facility];
    let occ = 0;
    const html = list.map(item => {
        if(item.occ) occ++;
        return `<div class="bay-card ${item.occ?'occupied':'available'}" onclick="toggleBay(${item.id})">
            <div class="bay-num">${item.name}</div>
            <div class="bay-status" style="color:${item.occ?'#ef4444':'#10b981'}">${item.occ?'이용 중':'예약 가능'}</div>
            <div style="font-size:11px;color:#94a3b8;margin-top:4px;">${item.user || '-'}</div>
            <div style="font-size:11px;color:#cbd5e1;margin-top:2px;">${item.time}</div>
        </div>`;
    }).join('');
    document.getElementById('bayContainer').innerHTML = html;
    document.getElementById('cntOcc').innerText = occ + '개';
    document.getElementById('cntAvail').innerText = (list.length - occ) + '개';
}

function switchFacility(fac, btn) {
    facility = fac;
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('facTitle').innerText = fac==='golf' ? '스크린골프 타석 실시간 현황도' : (fac==='swim'?'실내 수영장 레인 실시간 관제':'피트니스 스마트 락커 현황');
    renderBays();
}

function toggleBay(id) {
    const item = data[facility].find(x => x.id === id);
    if (!item) return;
    item.occ = !item.occ;
    item.user = item.occ ? '현장 발권 회원' : '';
    item.time = item.occ ? '60분 남음' : '비어있음';
    renderBays();
}

function quickCheckIn() {
    const target = data[facility].find(x => !x.occ);
    if(target) {
        target.occ = true;
        target.user = 'QR 체크인 회원';
        target.time = '60분 남음';
        renderBays();
        alert(`[${target.name}] 배정 완료!`);
    } else {
        alert('현재 모든 자리가 이용 중입니다.');
    }
}
renderBays();
</script>
</body>
</html>
