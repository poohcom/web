<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2026 위시켓 프로젝트 포털 & 데모 갤러리 (29건)</title>
<style>
:root {
    --bg: #070b14;
    --card: #0f172a;
    --card-border: #1e293b;
    --card-hover: #172554;
    --text: #f8fafc;
    --text-muted: #94a3b8;
    --primary: #3b82f6;
    --accent: #6366f1;
}
* { margin:0; padding:0; box-sizing:border-box; font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
body { background: var(--bg); color: var(--text); min-height: 100vh; padding-bottom: 60px; }
a { color: inherit; text-decoration: none; }

/* Hero Section */
.hero {
    background: radial-gradient(circle at 50% -20%, #1e3a8a 0%, #070b14 70%);
    border-bottom: 1px solid var(--card-border);
    padding: 60px 24px 40px;
    text-align: center;
}
.hero-badge {
    display: inline-block;
    padding: 6px 16px;
    background: rgba(59, 130, 246, 0.15);
    border: 1px solid rgba(59, 130, 246, 0.4);
    color: #60a5fa;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 16px;
}
.hero h1 {
    font-size: 38px;
    font-weight: 900;
    letter-spacing: -0.5px;
    background: linear-gradient(135deg, #ffffff 40%, #94a3b8 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 12px;
}
.hero p {
    font-size: 16px;
    color: var(--text-muted);
    max-width: 760px;
    margin: 0 auto 28px;
    line-height: 1.6;
}

/* Quick Stats Bar */
.stats-bar {
    display: flex;
    justify-content: center;
    gap: 32px;
    margin-top: 24px;
    flex-wrap: wrap;
}
.stat-pill {
    background: rgba(15, 23, 42, 0.8);
    border: 1px solid var(--card-border);
    padding: 10px 20px;
    border-radius: 12px;
    font-size: 13px;
    color: var(--text-muted);
}
.stat-pill strong {
    color: #fff;
    font-size: 18px;
    margin-right: 6px;
}

/* Controls Bar */
.controls-wrap {
    max-width: 1400px;
    margin: -24px auto 30px;
    padding: 0 24px;
    position: relative;
    z-index: 10;
}
.controls-bar {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 14px;
    padding: 16px 20px;
    display: flex;
    gap: 16px;
    align-items: center;
    box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
    flex-wrap: wrap;
}
.search-box {
    flex: 1;
    min-width: 260px;
    position: relative;
}
.search-input {
    width: 100%;
    background: #070b14;
    border: 1px solid #334155;
    padding: 12px 16px 12px 40px;
    border-radius: 8px;
    color: #fff;
    font-size: 14px;
    outline: none;
}
.search-input:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.2);
}
.search-icon {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-muted);
    font-size: 16px;
}
.filter-tabs {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
}
.filter-btn {
    background: #070b14;
    border: 1px solid #334155;
    color: var(--text-muted);
    padding: 8px 14px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
}
.filter-btn:hover {
    color: #fff;
    border-color: #64748b;
}
.filter-btn.active {
    background: var(--primary);
    color: #fff;
    border-color: var(--primary);
}

/* Project Grid */
.grid-container {
    max-width: 1400px;
    margin: 0 auto;
    padding: 0 24px;
}
.project-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
    gap: 24px;
}
.card {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: 14px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
}
.card:hover {
    transform: translateY(-4px);
    border-color: #3b82f6;
    box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5);
}
.card-thumb {
    height: 190px;
    background: #000;
    position: relative;
    overflow: hidden;
    cursor: pointer;
}
.card-thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 0.3s;
}
.card:hover .card-thumb img {{
    transform: scale(1.05);
}}
.thumb-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(0,0,0,0.1) 0%, rgba(15,23,42,0.9) 100%);
    display: flex;
    align-items: flex-end;
    padding: 14px;
}
.thumb-tag {
    font-size: 11px;
    font-weight: 700;
    color: #fff;
    padding: 4px 8px;
    border-radius: 4px;
    background: rgba(0,0,0,0.6);
    backdrop-filter: blur(4px);
}
.card-body {
    padding: 18px;
    display: flex;
    flex-direction: column;
    flex: 1;
}
.card-meta-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
}
.card-category {
    font-size: 12px;
    font-weight: 700;
    color: #60a5fa;
}
.ai-tag {
    font-size: 11px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 4px;
}
.ai-상 { background: rgba(16, 185, 129, 0.15); color: #10b981; border: 1px solid rgba(16, 185, 129, 0.3); }
.ai-중 { background: rgba(245, 158, 11, 0.15); color: #f59e0b; border: 1px solid rgba(245, 158, 11, 0.3); }
.ai-하 { background: rgba(239, 68, 68, 0.15); color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.3); }

.card-title {
    font-size: 16px;
    font-weight: 700;
    color: #f8fafc;
    line-height: 1.4;
    margin-bottom: 10px;
    height: 44px;
    overflow: hidden;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
}
.card-summary {
    font-size: 13px;
    color: var(--text-muted);
    line-height: 1.5;
    margin-bottom: 16px;
    height: 40px;
    overflow: hidden;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
}

.info-grid {
    background: #070b14;
    border: 1px solid var(--card-border);
    border-radius: 8px;
    padding: 10px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-bottom: 16px;
    font-size: 12px;
}
.info-row span { color: var(--text-muted); margin-right: 4px; }
.info-row strong { color: #fff; }

.card-actions {
    display: flex;
    gap: 8px;
    margin-top: auto;
}
.btn-demo {
    flex: 1;
    background: #2563eb;
    color: #fff;
    font-size: 13px;
    font-weight: 600;
    padding: 10px;
    border-radius: 8px;
    text-align: center;
    transition: background 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
}
.btn-demo:hover {
    background: #1d4ed8;
}
.btn-preview {
    background: #1e293b;
    border: 1px solid #334155;
    color: #cbd5e1;
    font-size: 13px;
    font-weight: 600;
    padding: 10px 14px;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.2s;
}
.btn-preview:hover {
    background: #334155;
    color: #fff;
}

/* Screenshot Modal */
.modal-overlay { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); z-index:999; backdrop-filter:blur(5px); justify-content:center; align-items:center; }
.modal-overlay.active { display:flex; }
.modal-box { background:#0f172a; border:1px solid #334155; border-radius:16px; width:92%; max-width:1100px; max-height:90vh; overflow:hidden; display:flex; flex-direction:column; box-shadow:0 25px 50px -12px rgba(0,0,0,0.9); }
.modal-header { padding:16px 24px; border-bottom:1px solid #1e293b; display:flex; justify-content:space-between; align-items:center; }
.modal-header h3 { font-size:18px; font-weight:700; color:#fff; }
.modal-close { background:none; border:none; color:#94a3b8; font-size:24px; cursor:pointer; }
.modal-body { padding:20px; overflow-y:auto; display:flex; flex-direction:column; gap:16px; }
.screen-nav { display:flex; gap:8px; overflow-x:auto; padding-bottom:8px; }
.screen-nav-btn { background:#1e293b; border:1px solid #334155; color:#94a3b8; padding:8px 14px; border-radius:8px; font-size:12px; font-weight:600; cursor:pointer; white-space:nowrap; }
.screen-nav-btn.active { background:#3b82f6; color:#fff; border-color:#3b82f6; }
.screen-preview-box { border-radius:8px; overflow:hidden; border:1px solid #334155; background:#000; position:relative; min-height:500px; display:flex; align-items:center; justify-content:center; }
.screen-preview-img { width:100%; height:auto; display:block; }
.screen-info { background:#1e293b; padding:14px 18px; border-radius:8px; }
.screen-info h4 { font-size:15px; color:#fff; margin-bottom:4px; }
.screen-info p { font-size:13px; color:#94a3b8; }
</style>
</head>
<body>

<section class="hero">
    <div class="hero-badge">2026-09-18 (금) 위시켓 프로젝트 분석 컬렉션</div>
    <h1>2026 위시켓 프로젝트 웹 데모 & 스크린샷 허브</h1>

            <button class="filter-btn" onclick="setFilter('웹/SaaS', this)">웹 & SaaS</button>
        </div>
    </div>
</div>

<div class="grid-container">
    <div class="project-grid" id="projectGrid"></div>
</div>

<div class="modal-overlay" id="screenshotModal" onclick="if(event.target===this)closeModal()">
    <div class="modal-box">
        <div class="modal-header">
            <h3 id="modalProjectTitle">유사 프로젝트 벤치마크 데모 스크린샷</h3>
            <button class="modal-close" onclick="closeModal()">&times;</button>
        </div>
        <div class="modal-body">
            <div class="screen-nav" id="screenNav"></div>
            <div class="screen-preview-box">
                <img id="previewImg" class="screen-preview-img" src="" alt="Benchmark Screenshot">
            </div>
            <div class="screen-info">
                <h4 id="screenTitle"></h4>
                <p id="screenDesc"></p>
            </div>
        </div>
    </div>
</div>

        if (currentFilter === 'AI:상') return p.ai_suit === '상';
        if (currentFilter === 'AI:중') return p.ai_suit === '중';
        if (currentFilter === 'AI:하') return p.ai_suit === '하';
        if (currentFilter === '3D/AI') return p.category.indexOf('3D') !== -1 || p.category.indexOf('AI') !== -1 || p.category.indexOf('ML') !== -1;
        if (currentFilter === '웹/SaaS') return p.category.indexOf('웹') !== -1 || p.category.indexOf('SaaS') !== -1 || p.category.indexOf('CRM') !== -1;
        return true;
    });

    var html = '';
    for (var i = 0; i < filtered.length; i++) {
        var p = filtered[i];
        html += '<div class="card">';
        html += '  <div class="card-thumb" onclick="openProjectModal(\'' + p.folder + '\')">';
        html += '    <img src="./' + p.folder + '/screenshots/demo_1.png" alt="' + p.title + ' 썸네일">';
        html += '    <div class="thumb-overlay"><span class="thumb-tag">📸 벤치마크 스크린샷 5종 포함</span></div>';
        html += '  </div>';
        html += '  <div class="card-body">';
        html += '    <div class="card-meta-top">';
        html += '      <span class="card-category">[' + p.num + '] ' + p.category + '</span>';
        html += '      <span class="ai-tag ai-' + p.ai_suit + '">AI 적합도: ' + p.ai_suit + '</span>';
        html += '    </div>';
        html += '    <h3 class="card-title">' + p.title + '</h3>';
        html += '    <p class="card-summary">' + p.summary + '</p>';
        html += '    <div class="info-grid">';
        html += '      <div class="info-row"><span>예산:</span><strong>' + p.budget + '</strong></div>';
        html += '      <div class="info-row"><span>기간:</span><strong>' + p.period + '</strong></div>';
        html += '      <div class="info-row" style="grid-column:span 2;"><span>스택:</span><strong>' + p.tech + '</strong></div>';
        html += '    </div>';
        html += '    <div class="card-actions">';
        html += '      <a href="./' + p.folder + '/index.html" class="btn-demo"><span>⚡</span> 웹 데모 실행</a>';
        html += '      <button class="btn-preview" onclick="openProjectModal(\'' + p.folder + '\')"><span>📸</span> 스크린샷 5종</button>';
        html += '    </div>';
        html += '  </div>';
        html += '</div>';
    }
    grid.innerHTML = html;
}

function setFilter(f, btn) {
    currentFilter = f;
    var btns = document.querySelectorAll('.filter-btn');
    for (var i = 0; i < btns.length; i++) {
        btns[i].classList.remove('active');
    }
    btn.classList.add('active');
    renderProjects();
}

function filterProjects() {
    renderProjects();
}

function openProjectModal(folder) {
    var proj = null;
    for (var i = 0; i < PROJECTS.length; i++) {
        if (PROJECTS[i].folder === folder) {
            proj = PROJECTS[i];
            break;
        }
    }
    if (!proj) return;
    currentModalProj = proj;
    document.getElementById('modalProjectTitle').innerText = '[' + proj.num + '] ' + proj.title + ' - 벤치마크 스크린샷 5종';
    
    var nav = document.getElementById('screenNav');
    var navHtml = '';
    for (var idx = 0; idx < proj.screens.length; idx++) {
        var s = proj.screens[idx];
        var act = idx === 0 ? 'active' : '';
        navHtml += '<button class="screen-nav-btn ' + act + '" onclick="showModalScreen(' + (idx + 1) + ')">0' + (idx + 1) + '. ' + s[0] + '</button>';
    }
    nav.innerHTML = navHtml;
    
    showModalScreen(1);
    document.getElementById('screenshotModal').classList.add('active');
}

function closeModal() {
    document.getElementById('screenshotModal').classList.remove('active');
}

function showModalScreen(idx) {
    if (!currentModalProj) return;
    var btns = document.querySelectorAll('.screen-nav-btn');
    for (var i = 0; i < btns.length; i++) {
        btns[i].classList.toggle('active', (i + 1) === idx);
    }
    var img = document.getElementById('previewImg');
    img.src = './' + currentModalProj.folder + '/screenshots/demo_' + idx + '.png';
    
    var s = currentModalProj.screens[idx - 1];
    document.getElementById('screenTitle').innerText = idx + '. ' + s[0];
    document.getElementById('screenDesc').innerText = s[1];
}

window.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') closeModal();
});

renderProjects();
</script>

</body>
</html>
