<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover"><title>Jump Game</title><style>* {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            width: 100vw;
            height: 100vh;
            height: 100dvh; /* 동적 뷰포트 높이 (최신 브라우저 지원) */
            overflow: hidden;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 0;
            position: fixed;
            top: 0;
            left: 0;
            touch-action: manipulation;
        }
        
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1000;
        }
        #game-container {
            position: relative;
            background: #000000;
            overflow: hidden;
            transform-origin: center center;
            width: 720px;
            height: 1280px;
            margin: 0 auto;
        }

        
        canvas {
            display: block;
            width: 100% !important;
            height: 100% !important;
            object-fit: contain;
            image-rendering: pixelated;
            image-rendering: -moz-crisp-edges;
            image-rendering: crisp-edges;
            pointer-events: auto;
            position: relative;
            z-index: 1;
        }
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1000;
            background: transparent;
        }
        .ui-layer * {
            pointer-events: auto;
        }
        button {
            font-size: clamp(16px, 2vw, 24px);
            padding: clamp(10px, 1.5vw, 15px) clamp(20px, 3vw, 30px);
            border: none;
            border-radius: 10px;
            background: #4CAF50;
            color: white;
            cursor: pointer;
            margin: clamp(5px, 1vw, 10px);
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }
        button:hover {
            background: #45a049;
        }
        button:active {
            transform: scale(0.95);
        }
        input[type="text"] {
            font-size: clamp(16px, 2vw, 20px);
            padding: clamp(8px, 1vw, 10px);
            border: 2px solid #ccc;
            border-radius: 5px;
            width: clamp(200px, 40vw, 300px);
        }</style><script defer="defer" src="bundle.8c37b6e09ba536ce3de0.js"></script></head><body><div id="game-container"><div id="ui-layer" class="ui-layer"></div></div><script type="module" src="./main.ts"></script></body></html>
