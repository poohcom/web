<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no,viewport-fit=cover"><title>Jump Game</title><style>* {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            width: 100vw;
            height: 100vh;
            height: 100dvh; /* 동적 뷰포트 높이 (최신 브라우저 지원) */
            overflow: hidden;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 0;
            position: fixed;
            top: 0;
            left: 0;
            touch-action: manipulation;
        }
        
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1000;
        }
        #game-container {
            position: relative;
            background: #000000;
            overflow: hidden;
            transform-origin: center center;
            width: 720px;
            height: 1280px;
            margin: 0 auto;
        }

        
        canvas {
            display: block;
            width: 100% !important;
            height: 100% !important;
            object-fit: contain;
            image-rendering: pixelated;
            image-rendering: -moz-crisp-edges;
            image-rendering: crisp-edges;
            pointer-events: auto;
            position: relative;
            z-index: 1;
        }
        .ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1000;
            background: transparent;
        }
        .ui-layer * {
            pointer-events: auto;
        }
        button {
            font-size: clamp(16px, 2vw, 24px);
            padding: clamp(10px, 1.5vw, 15px) clamp(20px, 3vw, 30px);
            border: none;
            border-radius: 10px;
            background: #4CAF50;
            color: white;
            cursor: pointer;
            margin: clamp(5px, 1vw, 10px);
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }
        button:hover {
            background: #45a049;
        }
        button:active {
            transform: scale(0.95);
        }
        input[type="text"] {
            font-size: clamp(16px, 2vw, 20px);
            padding: clamp(8px, 1vw, 10px);
            border: 2px solid #ccc;
            border-radius: 5px;
            width: clamp(200px, 40vw, 300px);
        }</style><script>// 시작 버튼 클릭 시 호출되는 함수
        // auth_code와 nickname을 파라미터로 받아서 처리합니다
        function startGame(authCode, nickname) {
            console.log('[index.html] Start button clicked with auth_code:', authCode, 'nickname:', nickname);
            
            // GameManager에 auth_code와 nickname 저장
            if (window.gameManager) {
                window.gameManager.setGameData({ 
                    authCode: authCode || '', 
                    nickname: nickname || '' 
                });
                
                // 로딩 화면으로 이동
                if (window.gameManager.ScreenType) {
                    window.gameManager.showScreen(window.gameManager.ScreenType.LOADING);
                } else {
                    // ScreenType이 아직 로드되지 않았으면 직접 문자열 사용
                    window.gameManager.showScreen('loading');
                }
            } else {
                console.error('[index.html] gameManager not found');
            }
        }
        
        // 게임 초기화 후 GameManager를 window에 등록하기 위한 함수
        window.registerGameManager = function(gameManager, ScreenType) {
            window.gameManager = gameManager;
            // ScreenType도 window에 등록
            window.gameManager.ScreenType = ScreenType;
        };</script><script defer="defer" src="bundle.09da8fdee9787a52c300.js"></script></head><body><div id="game-container"><div id="ui-layer" class="ui-layer"></div></div><script type="module" src="./main.ts"></script></body></html>
