<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Video Player</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            background: #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin: 0;
            padding: 20px;
            position: fixed;
            top: 0;
            left: 0;
            touch-action: manipulation;
        }
        
        .container {
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }
        
        #playButton {
            padding: 20px 40px;
            font-size: 24px;
            border: none;
            border-radius: 10px;
            background: #4CAF50;
            color: white;
            cursor: pointer;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            font-weight: bold;
            transition: background 0.3s;
        }
        
        #playButton:hover {
            background: #45a049;
        }
        
        #playButton:active {
            transform: scale(0.95);
        }
        
        #videoContainer {
            width: 100%;
            max-width: 800px;
            display: none;
            position: relative;
            background: #000;
        }
        
        #videoContainer.show {
            display: block;
        }
        
        #videoPlayer {
            width: 100%;
            height: auto;
            display: block;
            background: #000;
        }
        
        #closeButton {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            border: 2px solid white;
            font-size: 24px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
        }
        
        #closeButton:hover {
            background: rgba(0, 0, 0, 0.9);
        }
        
        .error-message {
            color: #ff6b6b;
            font-size: 18px;
            text-align: center;
            margin-top: 20px;
            display: none;
        }
        
        .error-message.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <button id="playButton">동영상 재생</button>
        
        <div id="videoContainer">
            <button id="closeButton">✕</button>
            <video id="videoPlayer" controls playsinline webkit-playsinline>
                <source src="images/adv.mp4" type="video/mp4">
                브라우저가 비디오 태그를 지원하지 않습니다.
            </video>
        </div>
        
        <div id="errorMessage" class="error-message"></div>
    </div>
    
    <script>
        const playButton = document.getElementById('playButton');
        const videoContainer = document.getElementById('videoContainer');
        const videoPlayer = document.getElementById('videoPlayer');
        const closeButton = document.getElementById('closeButton');
        const errorMessage = document.getElementById('errorMessage');
        
        // 동영상 재생 버튼 클릭
        playButton.addEventListener('click', () => {
            try {
                // 비디오 컨테이너 표시
                videoContainer.classList.add('show');
                
                // 비디오 로드 및 재생
                //videoPlayer.load();
                videoPlayer.play().catch(error => {
                    console.error('비디오 재생 실패:', error);
                    showError('비디오 재생에 실패했습니다. 사용자 상호작용이 필요할 수 있습니다.');
                });
            } catch (error) {
                console.error('비디오 재생 오류:', error);
                showError('비디오 재생 중 오류가 발생했습니다.');
            }
        });
        
        // 닫기 버튼 클릭
        closeButton.addEventListener('click', () => {
            videoPlayer.pause();
            videoPlayer.currentTime = 0;
            videoContainer.classList.remove('show');
            hideError();
        });
        
        // 비디오 종료 시 컨테이너 숨기기
        videoPlayer.addEventListener('ended', () => {
            videoContainer.classList.remove('show');
        });
        
        // 비디오 에러 처리
        videoPlayer.addEventListener('error', (e) => {
            console.error('비디오 에러:', e);
            const error = videoPlayer.error;
            if (error) {
                let errorMsg = '비디오를 로드할 수 없습니다.';
                switch (error.code) {
                    case error.MEDIA_ERR_ABORTED:
                        errorMsg = '비디오 로드가 중단되었습니다.';
                        break;
                    case error.MEDIA_ERR_NETWORK:
                        errorMsg = '네트워크 오류로 비디오를 로드할 수 없습니다.';
                        break;
                    case error.MEDIA_ERR_DECODE:
                        errorMsg = '비디오 디코딩 오류가 발생했습니다.';
                        break;
                    case error.MEDIA_ERR_SRC_NOT_SUPPORTED:
                        errorMsg = '비디오 형식이 지원되지 않습니다.';
                        break;
                }
                showError(errorMsg);
            }
        });
        
        // 에러 메시지 표시
        function showError(message) {
            errorMessage.textContent = message;
            errorMessage.classList.add('show');
        }
        
        // 에러 메시지 숨기기
        function hideError() {
            errorMessage.classList.remove('show');
        }
        
        // 터치 이벤트 처리 (모바일 호환성)
        playButton.addEventListener('touchstart', (e) => {
            e.preventDefault();
            playButton.click();
        }, { passive: false });
        
        closeButton.addEventListener('touchstart', (e) => {
            e.preventDefault();
            closeButton.click();
        }, { passive: false });
    </script>
</body>
</html>
